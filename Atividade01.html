<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        .header,
        .footer {
            background-color: rgb(194, 227, 255);
            padding: 15px;
            text-align: center;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 10px;
        }

        .item {
            background-color: rgb(194, 227, 255);
            border: 1px solid #00343b;
            padding: 15px;
            flex: 1;
        }

        .item2 {
            background-color: aliceblue;
            border: 1px solid #00343b;
            padding: 15px;
            flex: 2;
        }
    </style>
</head>

<body>
    <header class="header">
        <h2>Minha Página</h2>
    </header>

    <div class="container">
        <div class="item">
            Principe Cruel
        </div>
        <div class="item2">
            Binding 13
        </div>
        <div class="item">
            Quarta Asa
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Minha Página. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
