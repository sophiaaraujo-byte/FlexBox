<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros - Agência de Livros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Ms+Madi&display=swap"
        rel="stylesheet">

    <style>
        .ms-madi-regular {
            font-family: "Ms Madi", cursive;
            font-weight: 400;
            font-style: normal;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ms Madi', cursive;
        }



        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
        }

        header {
            background-color: #538200;
            color: #bfd29a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 20px;
        }

        header .logo {
            font-size: 30px;
            font-weight: bold;
            font-family: 'Ms Madi', cursive;
        }

        header nav a {
            color: #9fab8c;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .banner img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .container-cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px 20px;
            flex: 1;
            background-color: #c2d69b;
        }

        .card {
            background-color: #9dbd83;
            width: 220px;
            border-radius: 10px;
            border: #538200 1px solid;
            box-shadow: 0 4px 10px #bfd397;
            overflow: hidden;
            text-align: center;
            padding-bottom: 18px;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h3 {
            margin-top: 14px;
            font-size: 20px;
            color: #222222;
            font-family: 'Ms Madi', cursive;
        }

        .card p {
            margin-top: 6px;
            font-size: 15px;
            color: #455600;
        }

        footer {
            background-color: #538200;
            color: #f9ffed;
            text-align: center;
            padding: 15px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Livros</div>
        <nav>
            <a href="#">Fantasia</a>
            <a href="#">Romance</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <section class="banner">
        <img src="fundo.jpg" alt="fundo">
    </section>

    <main class="container-cards">
        <div class="card">
            <img src="acotar.jpg" alt="acotar">
            <h3>Romantasia</h3>
            <p>Acotar</p>
        </div>

        <div class="card">
            <img src="livraria.jpg" alt="livraria">
            <h3>Romance</h3>
            <p>Pequena livraria dos corações solitários</p>
        </div>

        <div class="card">
            <img src="principe-cruel.jpg" alt="principe-cruel">
            <h3>Fantasia</h3>
            <p>Principe cruel</p>
        </div>

        <div class="card">
            <img src="janela-sombria.jpg" alt="janela-sombria">
            <h3>Romantasia</h3>
            <p>Uma janela sombria</p>
        </div>
    </main>

    <footer>
        <p>© 2025 Livros - Todos os direitos reservados</p>
    </footer>

</body>

</html>
